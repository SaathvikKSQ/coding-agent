[project]
name = "financial_rearcher"
version = "0.1.0"
description = "financial_rearcher using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.15.20",
    "crewai[google-genai,tools]>=1.15.20,<2.0.0",
]

[project.scripts]
financial_rearcher = "financial_rearcher.main:run"
run_crew = "financial_rearcher.main:run"
train = "financial_rearcher.main:train"
replay = "financial_rearcher.main:replay"
test = "financial_rearcher.main:test"
run_with_trigger = "financial_rearcher.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "6fe5e999-4ce5-4b29-bd05-4d5522c06b54"
